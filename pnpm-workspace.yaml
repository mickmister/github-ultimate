packages:
  - webapp
  - mobile

overrides:
  'monaco-editor>dompurify': '3.4.17'

allowBuilds:
  '@ast-grep/cli': true
  '@mickmister/openlint': true
  esbuild: true
  # EAS CLI: optional native tracing and version-advice-only postinstall.
  dtrace-provider: false
  protobufjs: false
  '@google/genai': false

patchedDependencies:
  react-native-webview@13.15.0: patches/react-native-webview@13.15.0.patch

minimumReleaseAgeExclude:
  # Published compiler being evaluated; keep this experiment's version explicit.
  - '@tsrs/wasm@7.1.0-beta.tsrs5'
