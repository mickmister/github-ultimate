<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GitHub Ultimate</title><style>
body{font:14px system-ui;background:#0d1117;color:#e6edf3;width:290px;padding:18px;line-height:1.6}h1{font-size:20px;margin:0}p{color:#a6b1bf}label{display:block;margin:14px 0}input{accent-color:#8b7cf8}button{background:#28243f;color:#fff;border:1px solid #7568bd;border-radius:6px;padding:8px;cursor:pointer}small{display:block;color:#a6b1bf}a{color:#b6a9ff}
body{box-sizing:border-box;width:326px;max-width:100vw;margin:0}label,button{min-height:44px}label{display:flex;align-items:center;gap:8px}input{width:22px;height:22px}button{font:inherit}
</style></head><body><h1>GitHub Ultimate</h1><p>Your PR, an agent workspace.</p>
<small id="version">Version __BUILD_VERSION__</small>
<label><input type="checkbox" id="enabled"> Enable PR workspace</label>
<label><input type="checkbox" id="inlineForms"> Render forms inline</label>
<label><input type="checkbox" id="rememberDrafts"> Remember form drafts locally</label>
<button id="clear">Clear saved form drafts</button><p id="status" role="status"></p>
<small>Works on github.com PRs and issues. No API token, telemetry, or workflow execution. Drafts stay in this browser profile.</small>
<p><a href="https://github.com/mickmister/github-ultimate#readme" target="_blank" rel="noopener noreferrer">Guide and examples ↗</a></p><script src="popup.js"></script></body></html>
