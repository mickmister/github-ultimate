apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'dev.githubultimate.companion.webview'
version = '0.1.0'

android {
  namespace 'dev.githubultimate.companion.webview'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName project.version.toString()
  }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.14.0'
}
