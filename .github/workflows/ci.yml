name: Browser extension
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:safari
      - run: npm run playground:build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run test:mobile
      - run: npm run test:playground
      - run: npm run package
      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "if ('v' + JSON.parse(require('fs').readFileSync('package.json')).version !== process.env.TAG) process.exit(1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-extension
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safari-webextension-resources
          path: dist-safari/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chrome-extension
          path: release
      - name: Generate release notes with direct asset links
        run: node --experimental-strip-types cli/release-notes.ts > "$RUNNER_TEMP/github-ultimate-release-notes.md"
      - name: Publish CI-built Chrome package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --title "GitHub Ultimate $TAG" --notes-file "$RUNNER_TEMP/github-ultimate-release-notes.md"
  prerelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && !github.event.deleted
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: continuous-prerelease-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chrome-extension
          path: release
      - name: Publish tested branch build
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_DELETED: ${{ github.event.deleted }}
        run: node --experimental-strip-types cli/prerelease.ts
