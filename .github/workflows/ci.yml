name: Browser extension
on:
  push:
    branches: ['**', '!gh-pages']
    tags: ['v*']
  workflow_dispatch:
  delete:

permissions:
  contents: read

# Keep job/step/shell telemetry without ptrace or language-runtime injection.
# These are read by Thoth's pre-hook and propagated to subsequent steps.
env:
  OTEL_SHELL_CONFIG_INJECT_DEEP: 'FALSE'
  OTEL_SHELL_CONFIG_OBSERVE_SUBPROCESSES: 'FALSE'
  OTEL_SHELL_CONFIG_OBSERVE_SIGNALS: 'FALSE'

jobs:
  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Audit job network traffic
        uses: mickmister/cargowall-action@vk/46e5-vd-multi-instanc
        with:
          start-phase: pre
          mode: audit
          offline: 'true'
          fail-on-unsupported: 'true'
      - name: Capture Thoth telemetry
        uses: plengauer/Thoth/actions/instrument/job@60ff0df1106176453b5ec87f96f927233759caea
        timeout-minutes: 2
        with:
          self_monitoring: 'false'
        env:
          OTEL_SERVICE_NAME: github-ultimate-assets
          OTEL_TRACES_EXPORTER: deferred
          OTEL_METRICS_EXPORTER: deferred
          OTEL_LOGS_EXPORTER: deferred
          OTEL_GITHUB_JOB_SHUTDOWN_TIMEOUT: '60'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@12.18.0 --activate
      - name: Locate pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-12-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-12-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run check
      - run: pnpm run webapp:check
      - run: pnpm run lint:tsx-view-boundary
      # Unit build tests intentionally overwrite default outputs. Build the
      # publishable assets afterwards so fixtures cannot enter a release.
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run build:safari
      - run: pnpm run pages:build
      - run: pnpm run playground:build
      - run: pnpm run storybook:build
      - name: Package the existing Chrome build
        run: node scripts/package.mjs
      - name: Archive browser test inputs
        run: tar -cf "$RUNNER_TEMP/browser-assets.tar" dist dist-safari hosted-dist playground-dist storybook-static
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-assets
          path: ${{ runner.temp }}/browser-assets.tar
          retention-days: 1
          if-no-files-found: error
      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "if ('v' + JSON.parse(require('fs').readFileSync('package.json')).version !== process.env.TAG) process.exit(1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-page
          path: hosted-dist/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-extension
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safari-webextension-resources
          path: dist-safari/
          if-no-files-found: error
      # CargoWall syncs each event to disk. Snapshot before post-job summaries.
      - name: Preserve job network audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargowall-${{ github.job }}-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
          path: |
            /tmp/cargowall-audit.json
            /tmp/cargowall.log
          retention-days: 7
          if-no-files-found: warn
  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: browser
            browsers: chromium
          - suite: mobile
            browsers: chromium webkit
          - suite: playground
            browsers: chromium
          - suite: storybook
            browsers: chromium
          - suite: webapp-storybook
            browsers: chromium
    steps:
      - name: Audit job network traffic
        uses: mickmister/cargowall-action@vk/46e5-vd-multi-instanc
        with:
          start-phase: pre
          mode: audit
          offline: 'true'
          fail-on-unsupported: 'true'
      - name: Capture Thoth telemetry
        uses: plengauer/Thoth/actions/instrument/job@60ff0df1106176453b5ec87f96f927233759caea
        timeout-minutes: 2
        with:
          self_monitoring: 'false'
        env:
          OTEL_SERVICE_NAME: github-ultimate-browser
          OTEL_TRACES_EXPORTER: deferred
          OTEL_METRICS_EXPORTER: deferred
          OTEL_LOGS_EXPORTER: deferred
          OTEL_GITHUB_JOB_SHUTDOWN_TIMEOUT: '60'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@12.18.0 --activate
      - name: Locate pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-12-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-12-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-assets
          path: ${{ runner.temp }}
      - run: tar -xf "$RUNNER_TEMP/browser-assets.tar"
      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-24.04-${{ matrix.browsers }}-${{ hashFiles('pnpm-lock.yaml') }}
      # System libraries are still required on cache hits.
      - name: Install browser binaries and system dependencies
        env:
          BROWSERS: ${{ matrix.browsers }}
        run: pnpm exec playwright install --with-deps $BROWSERS
      - name: Test built assets
        env:
          SUITE: ${{ matrix.suite }}
          TEST_BUILT_ASSETS: 'true'
        run: pnpm run "test:$SUITE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: ignore
      - name: Preserve job network audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargowall-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            /tmp/cargowall-audit.json
            /tmp/cargowall.log
          retention-days: 7
          if-no-files-found: warn
  verify:
    if: always() && github.event_name != 'delete'
    needs: [build, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every build, check and browser suite
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chrome-extension
          path: release
      - name: Generate release notes with direct asset links
        run: node --experimental-strip-types cli/release-notes.ts > "$RUNNER_TEMP/github-ultimate-release-notes.md"
      - name: Publish CI-built Chrome package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --title "GitHub Ultimate $TAG" --notes-file "$RUNNER_TEMP/github-ultimate-release-notes.md"
  prerelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && !github.event.deleted
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: continuous-prerelease-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@12.18.0 --activate
      - run: pnpm --filter github-ultimate install --prod --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chrome-extension
          path: release
      - name: Publish tested branch build
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_DELETED: ${{ github.event.deleted }}
        run: node --experimental-strip-types cli/prerelease.ts
  pages:
    if: >-
      always() && github.repository == 'mickmister/github-ultimate' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name != 'gh-pages' && needs.verify.result == 'success') ||
       (github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'gh-pages'))
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
      statuses: write
      actions: read
    concurrency:
      group: github-ultimate-pages-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Audit Pages network traffic
        uses: mickmister/cargowall-action@vk/46e5-vd-multi-instanc
        with:
          start-phase: pre
          mode: audit
          offline: 'true'
          fail-on-unsupported: 'true'
      - name: Capture Thoth telemetry
        uses: plengauer/Thoth/actions/instrument/job@60ff0df1106176453b5ec87f96f927233759caea
        timeout-minutes: 2
        with:
          self_monitoring: 'false'
        env:
          OTEL_SERVICE_NAME: github-ultimate-pages
          OTEL_TRACES_EXPORTER: deferred
          OTEL_METRICS_EXPORTER: deferred
          OTEL_LOGS_EXPORTER: deferred
          OTEL_GITHUB_JOB_SHUTDOWN_TIMEOUT: '60'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name != 'delete'
        with:
          name: hosted-page
          path: hosted-dist
      - name: Replace branch preview and prune deleted branches
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-hosted.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.publish.outputs.skipped != 'true'
        with:
          path: pages-site
          retention-days: 1
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: steps.publish.outputs.skipped != 'true'
        id: deploy
      - name: Report published Pages commit statuses
        if: steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          PREVIEW_PATH: ${{ steps.publish.outputs.preview_path }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';

          const root = `${process.env.PAGE_URL.replace(/\/$/, '')}/`;
          const preview = process.env.PREVIEW_PATH;
          const base = preview ? `${root}${preview}/` : root;
          const statuses = [
            { context: 'github-pages', url: base, description: preview ? 'Hosted branch preview published' : 'Branch preview index published' },
            ...(preview ? [{ context: 'github-pages/storybook', url: `${base}storybook/`, description: 'Mock-data Storybook published' }] : []),
          ];
          for (const { context, url, description } of statuses) {
            execFileSync('gh', [
              'api', '--method', 'POST', `repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`,
              '-f', 'state=success', '-f', `context=${context}`, '-f', `target_url=${url}`, '-f', `description=${description}`,
            ], { stdio: 'inherit' });
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${statuses.map(({ context, url }) => `[${context}](${url})`).join(' · ')}\n`);
          NODE
      - name: Preserve Pages network audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargowall-pages-${{ github.run_attempt }}
          path: |
            /tmp/cargowall-audit.json
            /tmp/cargowall.log
          retention-days: 7
          if-no-files-found: warn
