name: Mobile update with EAS
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to update
        type: choice
        default: all
        options: [all, android, ios]
      profile:
        description: EAS channel and environment
        type: choice
        default: preview
        options: [development, preview, production]
      message:
        description: Update message (defaults to source SHA)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: eas-update-${{ inputs.profile }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@12.18.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir mobile run check
      - run: pnpm exec vitest run tests/mobile-alohak.test.ts tests/mobile-eas.test.ts
      - name: Publish update to EAS
        env:
          EAS_OPERATION: update
          EAS_PLATFORM: ${{ inputs.platform }}
          EAS_PROFILE: ${{ inputs.profile }}
          EAS_MESSAGE: ${{ inputs.message }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
          EXPO_PUBLIC_ALOHAK_URL: ${{ secrets.EXPO_PUBLIC_ALOHAK_URL }}
          EAS_RESULT_PATH: ${{ runner.temp }}/eas-update.json
          EXPO_NO_TELEMETRY: '1'
        run: node scripts/eas-mobile.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eas-update-${{ inputs.platform }}-${{ inputs.profile }}
          path: ${{ runner.temp }}/eas-update.json
          if-no-files-found: ignore
          retention-days: 7
