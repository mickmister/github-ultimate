name: Mobile local build
on:
  push:
    branches: ['**', '!gh-pages']
    paths: ['mobile/**', 'patches/**', 'src/mobile-*.ts', 'src/*workspace-cache.ts', 'src/cache-settings.ts', 'src/connections.ts', 'src/git-reads.ts', 'src/github-rate-limit.ts', 'src/hosted-protocol.ts', 'src/utf8.ts', 'src/page-kv.ts', 'src/page-storage.ts', 'tests/mobile-*.test.ts', 'tests/workspace-cache.test.ts', 'tests/page-storage.test.ts', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/mobile-build-local.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
          - platform: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@12.18.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir mobile run check
      - run: pnpm exec vitest run tests/mobile-alohak.test.ts tests/mobile-github.test.ts tests/mobile-webview.test.ts tests/mobile-eas.test.ts tests/page-storage.test.ts tests/connections.test.ts tests/workspace-cache.test.ts
      - name: Generate the native project
        run: pnpm --dir mobile exec expo prebuild --no-install --platform ${{ matrix.platform }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android app and native adapter
        if: matrix.platform == 'android'
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=x86_64
      - name: Install iOS pods
        if: matrix.platform == 'ios'
        working-directory: mobile/ios
        run: pod install
      - name: Compile iOS simulator app and native adapter
        if: matrix.platform == 'ios'
        working-directory: mobile/ios
        run: xcodebuild -workspace Alohak.xcworkspace -scheme Alohak -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      # Compilation is not signed-device isolation/authentication acceptance.
