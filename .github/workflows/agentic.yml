name: Agentic workspace

on:
  workflow_dispatch:
  issues:
    types: [opened]
  # Includes issue comments and PR conversation comments.
  issue_comment:
    types: [created]
  # Route PR creation using the default-branch workflow definition.
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  entry:
    uses: mickmister/gh-agentic-workflows/.github/workflows/agentic-entry.yml@vk/46e5-vd-multi-instanc
    secrets:
      AGENT_APP_ID: ${{ secrets.AGENT_APP_ID }}
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      NUGS_STORAGE_URL: ${{ secrets.NUGS_STORAGE_URL }}
